metadata_version: 1
name: Metaheuristics for the Unrelated Parallel Machines Scheduling with Setups
description: This capsule contains our implementation of 12 metaheuristics published
  between 2011 and 2022 for the Unrelated Parallel Machines Scheduling Problem with
  setups. The user can compare the number of iterations, the number of objective function
  evaluations, and the best objective under the same stop criterion.
